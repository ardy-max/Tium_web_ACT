<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ACT</title>
  <link rel="icon" href="../../public/images/act tab logo.jpg" sizes="36x36" type="image/png">
  <link rel="stylesheet" href="../../public/css/global.css">
  <style>
    body {
        background-color: var(--color-bg-light);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .login-container {
        background: var(--color-white);
        padding: 40px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .login-logo {
        width: 80px;
        margin-bottom: 20px;
    }
    .login-container h2 {
        color: var(--color-navy);
        margin-bottom: 30px;
    }
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--color-text);
    }
    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--color-gray-light);
        border-radius: var(--radius-sm);
        font-family: inherit;
    }
    .btn-login {
        width: 100%;
        padding: 14px;
        background-color: var(--color-accent);
        color: var(--color-white);
        border: none;
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .btn-login:hover {
        background-color: #d15600; /* Darker accent */
    }
    .error-msg {
        color: #e74c3c;
        margin-bottom: 15px;
        display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="../../public/images/ACT logo.png" alt="ACT Logo" class="login-logo">
    <h2>Admin Login</h2>
    <div id="error-msg" class="error-msg"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-login">Login</button>
    </form>
    <div style="margin-top: 20px;">
        <a href="home/index.html" style="color: var(--color-gray); text-decoration: none; font-size: 0.9rem;">&larr; Kembali ke Home</a>
    </div>
  </div>

  <script src="../controllers/login.controller.js"></script>
</body>
</html>
