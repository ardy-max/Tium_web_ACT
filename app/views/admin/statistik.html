<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Statistik | ACT</title>
  <link rel="icon" href="../../../public/images/act tab logo.jpg" sizes="36x36" type="image/png">
  <link rel="stylesheet" href="../../../public/css/global.css">
  <link rel="stylesheet" href="../../../public/css/pages/admin.css">
</head>
<body>
<div class="admin-layout">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../../public/images/ACT logo.png" alt="ACT Logo">
      <p>Admin Panel</p>
    </div>
    <nav>
      <ul>
        <li><a href="./index.html">📊 Dashboard</a></li>
        <li><a href="./artikel.html">📰 Artikel</a></li>
        <li><a href="./statistik.html" class="active">📈 Statistik</a></li>
        <li><a href="./galeri.html">🖼️ Galeri</a></li>
        <li><a href="./pendaftaran.html">📋 Pendaftaran</a></li>
        <li><a href="./donasi.html">💰 Donasi</a></li>
      </ul>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="top-bar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar">
        <span></span><span></span><span></span>
      </button>
      <h2>Manajemen Statistik</h2>
      <div class="top-bar-right">
        <a href="../../../app/views/home/index.html" target="_blank"
           style="font-size:13px;color:var(--color-accent);text-decoration:none;white-space:nowrap;">Lihat Situs ↗</a>
        <button class="btn-logout">Logout</button>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="page-header">
        <h2>Data Statistik</h2>
        <button class="btn btn-primary" id="btn-tambah">+ Tambah Statistik</button>
      </div>

      <div id="alert-container"></div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:44px">No</th>
              <th>Nama Statistik</th>
              <th>Nilai</th>
              <th>Deskripsi</th>
              <th style="width:70px">Urutan</th>
              <th style="width:140px">Aksi</th>
            </tr>
          </thead>
          <tbody id="statistik-tbody">
            <tr><td colspan="6" class="empty-state"><p>Memuat data…</p></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal Tambah / Edit Statistik -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Tambah Statistik</h3>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="stat-id">
      <div class="form-group">
        <label class="form-label">Nama Statistik *</label>
        <input type="text" class="form-control" id="f-nama_stat" required
               placeholder="Contoh: Jumlah Anak yang Dibantu">
      </div>
      <div class="form-group">
        <label class="form-label">Nilai *</label>
        <input type="text" class="form-control" id="f-nilai_stat" required
               placeholder="Contoh: 30, 90%, Rp 10 Juta">
      </div>
      <div class="form-group">
        <label class="form-label">Deskripsi</label>
        <textarea class="form-control" id="f-deskripsi" rows="3"
                  placeholder="Penjelasan singkat statistik ini…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Urutan Tampil</label>
        <input type="number" class="form-control" id="f-urutan" min="0" value="0"
               placeholder="Angka urutan (0 = pertama)">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btn-batal">Batal</button>
      <button class="btn btn-primary" id="btn-simpan">💾 Simpan</button>
    </div>
  </div>
</div>

<script src="../../controllers/admin.controller.js"></script>
<script src="../../controllers/admin-statistik.controller.js"></script>
</body>
</html>
