<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Artikel | ACT</title>
  <link rel="icon" href="../../../public/images/act tab logo.jpg" sizes="36x36" type="image/png">
  <link rel="stylesheet" href="../../../public/css/global.css">
  <link rel="stylesheet" href="../../../public/css/pages/admin.css">
</head>
<body>
<div class="admin-layout">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../../public/images/ACT logo.png" alt="ACT Logo">
      <p>Admin Panel</p>
    </div>
    <nav>
      <ul>
        <li><a href="./index.html">📊 Dashboard</a></li>
        <li><a href="./artikel.html" class="active">📰 Artikel</a></li>
        <li><a href="./statistik.html">📈 Statistik</a></li>
        <li><a href="./galeri.html">🖼️ Galeri</a></li>
        <li><a href="./pendaftaran.html">📋 Pendaftaran</a></li>
        <li><a href="./donasi.html">💰 Donasi</a></li>
      </ul>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="top-bar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar">
        <span></span><span></span><span></span>
      </button>
      <h2>Manajemen Artikel</h2>
      <div class="top-bar-right">
        <a href="../../../app/views/home/index.html" target="_blank"
           style="font-size:13px;color:var(--color-accent);text-decoration:none;white-space:nowrap;">Lihat Situs ↗</a>
        <button class="btn-logout">Logout</button>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="page-header">
        <h2>Daftar Artikel</h2>
        <button class="btn btn-primary" id="btn-tambah">+ Tambah Artikel</button>
      </div>

      <div id="alert-container"></div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:44px">No</th>
              <th>Judul</th>
              <th>Kategori</th>
              <th>Penulis</th>
              <th>Tanggal</th>
              <th>Status</th>
              <th style="width:140px">Aksi</th>
            </tr>
          </thead>
          <tbody id="artikel-tbody">
            <tr><td colspan="7" class="empty-state"><p>Memuat data…</p></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal Tambah / Edit -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Tambah Artikel</h3>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="artikel-id">
      <div class="form-group">
        <label class="form-label">Judul *</label>
        <input type="text" class="form-control" id="f-judul" required placeholder="Judul artikel">
      </div>
      <div class="form-group">
        <label class="form-label">Kategori *</label>
        <input type="text" class="form-control" id="f-kategori" required placeholder="Contoh: Terapi, Mental Health">
      </div>
      <div class="form-group">
        <label class="form-label">Ringkasan *</label>
        <textarea class="form-control" id="f-ringkasan" rows="3" required placeholder="Ringkasan singkat artikel…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Penulis *</label>
        <input type="text" class="form-control" id="f-penulis" required placeholder="Nama penulis">
      </div>
      <div class="form-group">
        <label class="form-label">Tanggal Publikasi *</label>
        <input type="date" class="form-control" id="f-tanggal" required>
      </div>
      <div class="form-group">
        <label class="form-label">URL Gambar</label>
        <input type="text" class="form-control" id="f-gambar_url" placeholder="https://… atau public/images/nama.jpg">
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-control" id="f-status">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btn-batal">Batal</button>
      <button class="btn btn-primary" id="btn-simpan">💾 Simpan</button>
    </div>
  </div>
</div>

<script src="../../controllers/admin.controller.js"></script>
<script src="../../controllers/admin-artikel.controller.js"></script>
</body>
</html>
